services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    volumes:
      - ./src/:/app
    environment:
      APP_ENV: e2e-testing
      LARAVEL_ENV_FILE: .env.e2e-testing
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - 80:80 # default HTTP port
      - 8081:80
    depends_on:
      - app
      - garage
    environment:
      IMAGE_BUCKET: e2e-bucket
    volumes:
      - ./src/:/app
  db:
    build:
      context: .
      dockerfile: ./docker/db/Dockerfile
    ports:
      - 3307:3307
    environment:
      MYSQL_DATABASE: memories_database_e2e
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      TZ: 'Asia/Tokyo'
    volumes:
      - mysql-e2e-volume:/var/lib/mysql
  # TODO: When adding the login authentication system, uncomment out below
  # redis:
  #   image: "redis:latest"
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - "./data/redis:/data"
  #     - "./docker/redis/redis.conf:/etc/redis.conf"
  #   command: ["redis-server", "/etc/redis.conf"] # TODO: 確認必須
  # Garage: S3-compatible object store (replaces MinIO). No admin console;
  # administer with: docker compose exec garage /garage <command>
  # S3 API :9020 / public web (website mode) :9021 / admin API :9022
  garage:
    image: dxflrs/garage:v2.6.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "9020:3900" # S3 API
      - "9021:3902" # public web endpoint (bucket chosen by Host header)
      - "9022:3903" # admin API
    environment:
      # !!! DEV-ONLY VALUES - do not reuse outside local/e2e. !!!
      GARAGE_RPC_SECRET: 553418b702138eaa392ce8295beb4949c6bcac4f7601b6e0e69d33a7432b7700
      GARAGE_ADMIN_TOKEN: 9E0hkINqC+Lc91bv9FfQAXPAktd9nbk/ilOc1jdHYO0=
      GARAGE_DEFAULT_ACCESS_KEY: GK9677c43fb0999c9ea7417b8168742c55
      GARAGE_DEFAULT_SECRET_KEY: 0382fcbe7461907de0bd7de9bdd24d9c9c20b47c544a91829aa0ee018a7e2900
      GARAGE_DEFAULT_BUCKET: e2e-bucket
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-e2e_meta:/var/lib/garage/meta
      - garage-e2e_data:/var/lib/garage/data

volumes:
  mysql-volume:
  mysql-e2e-volume:
  garage-e2e_meta:
  garage-e2e_data:
